name: Documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate
        run: cargo doc --no-deps

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/doc

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    permissions: 
      id-token: write
      pages: write

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
